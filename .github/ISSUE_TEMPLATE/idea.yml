name: Idea or feature request
description: Suggest something UrTube could do (better)
labels: [idea]
body:
  - type: markdown
    attributes:
      value: Ideas are very welcome! English or German is fine.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like UrTube to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: The situation or problem behind the idea.
